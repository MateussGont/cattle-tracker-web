# Preserve o contrato e o listener interno; credenciais externas separadas.
per_listener_settings true
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_packet_size 16384
log_dest stdout
connection_messages false

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/gateway-passwd
acl_file /mosquitto/config/acl
certfile /certs/mqtt/current/fullchain.pem
keyfile /certs/mqtt/current/key.pem
tls_version tlsv1.2
require_certificate false
max_connections 20
