name: cattle-tracker

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    restart: unless-stopped
    user: "1883:1883"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${STATE_DIR:?Defina STATE_DIR}/mosquitto/acl:/mosquitto/config/acl:ro
      - ${STATE_DIR:?Defina STATE_DIR}/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
    networks: [private, broker_access]
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 1883"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  private:
    internal: true
  broker_access:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

volumes:
  mosquitto_data:
